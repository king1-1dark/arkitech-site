<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>События — Arkitech Studio</title>
  <meta name="description" content="Календарь митапов, плейтестов и мастер-классов Arkitech. Тестовая версия.">
  <meta name="theme-color" content="#101114">
  <link rel="canonical" href="https://arkitech.studio/events.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Arkitech Studio">
  <meta property="og:title" content="События — Arkitech Studio">
  <meta property="og:description" content="Календарь митапов, плейтестов и мастер-классов Arkitech. Тестовая версия.">
  <meta property="og:image" content="https://arkitech.studio/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="events">
  <header id="header"></header>
  <main id="top">
    <!-- Параллакс-шапка страницы -->
    <section class="hero hero--page scene" data-parallax>
      <img class="layer" data-layer="bg" data-depth="0.05" alt="">
      <img class="layer" data-layer="far" data-depth="0.25" alt="">
      <img class="layer" data-layer="mid" data-depth="0.5" alt="">
      <div class="hero__content container" data-depth="0.35" data-fade>
        <p class="eyebrow"><span class="dot"></span><span>Календарь · тест</span></p>
        <h1 class="hero__title hero__title--page">События и <span class="grad">встречи</span></h1>
        <p class="hero__lead">Митапы, плейтесты, мастер-классы и стримы. Бесплатные — по регистрации, платные — регистрация и оплата после подтверждения.</p>
        <div class="hero__actions"><a class="btn btn--primary btn--big" href="#calendar">Календарь <span class="btn__arrow" aria-hidden="true">→</span></a></div>
      </div>
      <img class="layer" data-layer="fg" data-depth="1" alt="">
      <img class="layer layer--particles" data-layer="particles" data-depth="1.35" alt="">
    </section>

    <section class="section" id="calendar">
      <div class="container container--narrow">
        <div class="tabs reveal" role="tablist" data-tabs>
          <button type="button" role="tab" data-tab="next" aria-selected="true">Ближайшие</button>
          <button type="button" role="tab" data-tab="past" aria-selected="false">Прошедшие</button>
        </div>
        <div data-panel="next"><div class="events" data-render="events"></div></div>
        <div data-panel="past" hidden><div class="events" data-render="events" data-past="true"></div></div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>

  <!-- Порядок важен: настройки → данные → каркас → страницы → эффекты -->
  <script src="js/config.js"></script>
  <script src="data/programs.js"></script>
  <script src="data/mentors.js"></script>
  <script src="data/jams.js"></script>
  <script src="data/events.js"></script>
  <script src="data/products.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
